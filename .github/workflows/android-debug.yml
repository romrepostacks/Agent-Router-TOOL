# Builds the Android app as a debug-signed APK on a GitHub Linux runner (sideload it; no Play Store signing).
# Run it from the Actions tab (Run workflow) or by pushing a change under mobile/.
name: Android app (debug APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-debug.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/build.mjs android
      - uses: actions/upload-artifact@v4
        with:
          name: AgentRouter-android-debug
          path: mobile/dist/*-debug.apk
          if-no-files-found: error
          retention-days: 30
